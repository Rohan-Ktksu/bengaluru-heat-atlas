[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bengaluru-urban-heat"
version = "0.1.0"
description = "A reproducible Bengaluru surface-heat research prototype"
requires-python = ">=3.11"
dependencies = [
    "earthengine-api>=1.6,<2",
    "folium>=0.19,<1",
    "pandas>=2.2,<4",
    "numpy>=2,<3",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.4,<5", "ipykernel>=6.29,<8"]

[tool.setuptools.packages.find]
where = ["src"]
